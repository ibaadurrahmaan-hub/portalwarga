.card {

}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;

.badge-mode {

h1 {

.subtitle {

/* STATS GRID */
.stats-grid {

  grid-template-columns: repeat(4, 1fr);
  gap: 12px;

}

.stat-item {

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 18px 12px;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.stat-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.stat-item:hover {
  transform: translateY(-3px);
  border-color: rgba(6, 182, 212, 0.3);
}

.stat-item:hover::before { opacity: 1; }

.stat-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #2563EB, #06B6D4);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  color: white;
  font-size: 0.85rem;
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);

  z-index: 1;
}

.stat-number {

  letter-spacing: -1px;

.stat-label {

  color: #94A3B8;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: relative;
  z-index: 1;
}

/* BUTTONS */
.btn-group {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.btn {
  flex: 1;
  min-width: 200px;

@keyframes spin { to { transform: rotate(360deg); } }

async function seedAll() {
  const btn = document.getElementById('btnSeed');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> <span>Seeding...</span>';
  logInit = false;
  
  try {
    logDivider();
    log('🚀 Mulai seed database e-commerce...', 'info');
    logDivider();

    log('👥 Seeding SELLERS...', 'info');
    for (const s of SELLERS) {
      await db.collection('sellers').doc(s.id).set({ ...s, bergabung: firebase.firestore.FieldValue.serverTimestamp() });
    }
    log(`   ✅ ${SELLERS.length} sellers created`, 'ok');

    log('📦 Seeding PRODUCTS...', 'info');
    for (const p of PRODUCTS) {
      await db.collection('produk').doc(String(p.id)).set({ ...p, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    log(`   ✅ ${PRODUCTS.length} products created`, 'ok');

    log('🔄 Sync ke koleksi "pasar" (backward compat)...', 'info');
    for (const p of PRODUCTS) {
      await db.collection('pasar').doc(String(p.id)).set({
        id: p.id, emoji: p.emoji, name: p.nama, vendor: p.sellerName, price: p.harga
      });
    }
    log(`   ✅ Synced`, 'ok');

    log('⭐ Seeding REVIEWS...', 'info');
    for (const r of REVIEWS) {
      await db.collection('reviews').add({ ...r, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    log(`   ✅ ${REVIEWS.length} reviews created`, 'ok');

    log('💳 Seeding PAYMENT METHODS...', 'info');
    for (const pm of PAYMENT_METHODS) {
      await db.collection('payment_methods').doc(pm.id).set(pm);
    }
    log(`   ✅ ${PAYMENT_METHODS.length} payment methods created`, 'ok');

    log('📝 Preparing empty collections...', 'info');
    await db.collection('orders').doc('_init').set({ _note: 'ready' });
    await db.collection('orders').doc('_init').delete();
    log(`   ✅ "orders" ready`, 'ok');

    logDivider();
    log('🎉 ALL DONE! Database e-commerce siap digunakan!', 'ok');
    log(`   📊 Total: ${SELLERS.length} sellers, ${PRODUCTS.length} products, ${REVIEWS.length} reviews`, 'ok');
    logDivider();

    btn.classList.add('success');
    btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>Berhasil! Klik untuk seed ulang</span>';
    setTimeout(() => btn.classList.remove('success'), 3000);
  } catch (e) {
    log('❌ Error: ' + e.message, 'err');
    btn.innerHTML = '<i class="fas fa-rocket"></i> <span>Seed E-commerce Data</span>';
  } finally {
    btn.disabled = false;
  }
}

async function clearAll() {
  if (!confirm('Yakin hapus SEMUA data e-commerce?')) return;
  logInit = false;
  logDivider();
  log('🗑️ Membersihkan database...', 'warn');
  
  const cols = ['sellers', 'produk', 'reviews', 'payment_methods'];
  for (const c of cols) {
    const snap = await db.collection(c).get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    log(`   ✅ ${c} cleared (${snap.size} docs)`, 'ok');
  }
  logDivider();
  log('✅ All data cleared successfully!', 'ok');
}
