// ==================== SEED ====================
async function seedAll() {
  const btn = document.getElementById('btnSeed');
  btn.disabled = true;
  btn.textContent = '⏳ Seeding...';

  try {
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
    log('🚀 Mulai seed database e-commerce...', 'info');

    // 1. Sellers
    log('👥 Seeding SELLERS...', 'info');
    for (const s of SELLERS) {
      await db.collection('sellers').doc(s.id).set({
        ...s, bergabung: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    log(`   ✅ ${SELLERS.length} sellers created`, 'ok');

    // 2. Products (koleksi baru "produk" yang lebih lengkap)
    log('📦 Seeding PRODUCTS...', 'info');
    for (const p of PRODUCTS) {
      await db.collection('produk').doc(String(p.id)).set({
        ...p, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    log(`   ✅ ${PRODUCTS.length} products created`, 'ok');

    // Backward compat: tetap update koleksi 'pasar' lama
    log('🔄 Sync ke koleksi "pasar" (backward compat)...', 'info');
    for (const p of PRODUCTS) {
      await db.collection('pasar').doc(String(p.id)).set({
        id: p.id, emoji: p.emoji, name: p.nama, vendor: p.sellerName, price: p.harga
      });
    }
    log(`   ✅ Synced`, 'ok');

    // 3. Reviews
    log('⭐ Seeding REVIEWS...', 'info');
    for (const r of REVIEWS) {
      await db.collection('reviews').add({
        ...r, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    log(`   ✅ ${REVIEWS.length} reviews created`, 'ok');

    // 4. Payment Methods
    log('💳 Seeding PAYMENT METHODS...', 'info');
    for (const pm of PAYMENT_METHODS) {
      await db.collection('payment_methods').doc(pm.id).set(pm);
    }
    log(`   ✅ ${PAYMENT_METHODS.length} payment methods created`, 'ok');

    // 5. Empty collections
    log('📝 Preparing empty collections...', 'info');
    await db.collection('orders').doc('_init').set({ _note: 'ready' });
    await db.collection('orders').doc('_init').delete();
    log(`   ✅ "orders" ready`, 'ok');

    log('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
    log('🎉 ALL DONE! Database e-commerce siap!', 'ok');
    log(`   📊 Total: ${SELLERS.length} sellers, ${PRODUCTS.length} products, ${REVIEWS.length} reviews`, 'ok');

  } catch (e) {
    log('❌ Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Seed E-commerce Data';
  }
}

async function clearAll() {
  if (!confirm('Yakin hapus SEMUA data e-commerce?')) return;
  const cols = ['sellers', 'produk', 'reviews', 'payment_methods'];
  for (const c of cols) {
    const snap = await db.collection(c).get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    log(`🗑️ ${c} cleared (${snap.size} docs)`, 'ok');
  }
  log('✅ All cleared!', 'ok');
}
</script>
</body>
</html>
